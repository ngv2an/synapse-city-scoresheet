<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Synapse City Scoresheet</title>
  <link rel="stylesheet" href="style.css">
  <script src="submit.js" defer></script>
  <script src="script.js" defer></script>
</head>

<body>
  <main class="scoresheet-app is-config-loading" id="scoresheet-app">
    <div class="config-loading" id="config-loading" role="status" aria-live="polite">
      Loading Config...
    </div>

    <!-- Competition and run information, one item per row -->
    <section class="entry-panel">
      <div class="entry-row entry-row-static">
        <span class="entry-label">Competition Name</span>
        <span class="entry-static-value competition-banner" id="competition-banner"></span>
      </div>

      <div class="entry-row entry-row-static">
        <span class="entry-label">Competition Date</span>
        <span class="entry-static-value meta-date" id="meta-date"></span>
      </div>

      <!-- Shown only when the device clock disagrees with the Config tab -->
      <div class="date-warning" id="date-warning" role="alert"></div>

      <label class="entry-row">
          <span class="entry-label">Judge</span>
          <select id="judge-select" class="entry-select">
            <option value="">-- Select Judge --</option>
          </select>
      </label>

      <!-- Level and Round are both read from Config / device time and are not selectable. -->
      <div class="entry-row entry-row-static">
        <span class="entry-label">Level</span>
        <div class="entry-static-value competition-meta" id="competition-meta">
          <span class="meta-level" id="meta-level"></span>
          <span class="meta-round" id="meta-round"></span>
        </div>
      </div>

      <label class="entry-row">
          <span class="entry-label">Team</span>
          <select id="team-select" class="entry-select">
            <option value="">-- Select Team --</option>
          </select>
      </label>

      <label class="entry-row">
          <span class="entry-label">Time</span>
          <!-- Stays type=text so the mask can hold '.'; inputmode brings up the
               numeric keypad, and pattern is what older iOS reads for the same thing. -->
          <input type="text" id="mission-time" class="entry-input" inputmode="numeric" pattern="[0-9]*"
                 placeholder="1.23.45" maxlength="7" autocomplete="off">
      </label>

      <div class="entry-row entry-row-try">
          <span class="entry-label">Try</span>
          <div class="try-control">
            <!-- The box comes first and stays open: any count can be typed without
                 hunting for a way out of the four shortcuts. -->
            <input type="text" id="try-input" class="try-input" inputmode="numeric" pattern="[0-9]*"
                   maxlength="2" placeholder="x" aria-label="Try count" autocomplete="off">
            <div class="try-options" id="try-options" role="group" aria-label="Common try counts">
              <button type="button" class="try-btn active" data-try="0" aria-pressed="true">0</button>
              <button type="button" class="try-btn" data-try="1" aria-pressed="false">1</button>
              <button type="button" class="try-btn" data-try="2" aria-pressed="false">2</button>
              <button type="button" class="try-btn" data-try="3" aria-pressed="false">3</button>
            </div>
          </div>
      </div>
    </section>

    <!-- Leanbot Table -->
    <section class="table-wrap">
      <table class="scoresheet-table leanbot-table" aria-label="Leanbot scoring">
        <tbody id="leanbot-table-body">
          <!-- Rows will be populated depending on Level -->
        </tbody>
      </table>
    </section>

    <!-- Main Table -->
    <section class="table-wrap">
      <table class="scoresheet-table">
        <thead>
          <tr>
            <th></th>
            <th>Containment</th>
            <th>Neutralization</th>
            <th>Analysis</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- Rows will be populated depending on Level -->
        </tbody>
      </table>
    </section>

    <!-- Existing score and photo controls stay together after the two scoring tables. -->
    <section class="score-action-bar" aria-label="Score and photo">
      <div class="total-score-badge">
        <span class="total-label">Total Score</span>
        <span class="total-score" id="total-score">0</span>
      </div>
      <button class="btn-action btn-photo" id="btn-photo" title="Photo">Photo</button>
    </section>

    <!-- Hidden Camera / File Input -->
    <input type="file" id="photo-input" accept="image/*" capture="environment" style="display: none;">

    <!-- Photo Preview Container (Below 2 Tables) -->
    <section class="photo-preview-container" id="photo-container" style="display: none;">
      <div class="photo-card">
        <div class="photo-header">
          <span class="photo-title">Mission Photo</span>
          <button type="button" class="btn-remove-photo" id="btn-remove-photo" title="Remove photo">&times;</button>
        </div>
        <div class="photo-img-wrap">
          <img id="photo-preview" src="" alt="Mission Photo">
        </div>
      </div>
    </section>

    <!-- Submit to Google Sheet -->
    <section class="submit-section">
      <button type="button" class="btn-submit" id="btn-submit">Submit</button>
      <p class="submit-status" id="submit-status" role="status" aria-live="polite"></p>
    </section>

    <!-- Footer Logo & Device Info -->
    <footer class="app-footer">
      <img src="image/syncitylogo.D2qIUmBC.png" alt="Synapse City">
      <div class="device-info">Device ID: <span id="device-id-display">---</span></div>
      <a class="sheet-link" id="view-submission-link"
         href="https://docs.google.com/spreadsheets/d/1jnnh5phoBJO1JsKtzumCIOHQUl3kyeY13fThvHza2Bc/edit"
         target="_blank" rel="noopener">View Submission &#8599;</a>
    </footer>

    <!-- Submission history is device-local and automatically expires after 24 hours. -->
    <section class="history-section" aria-labelledby="history-title">
      <div class="history-header">
        <h2 id="history-title">History</h2>
        <span>Last 24 hours</span>
      </div>

      <p class="history-empty" id="history-empty">No submissions in the last 24 hours.</p>

      <div class="history-table-wrap" id="history-table-wrap" hidden>
        <table class="history-table">
          <thead>
            <tr>
              <th>Submitted</th>
              <th>Team</th>
              <th>Round</th>
              <th>Score</th>
            </tr>
          </thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
    </section>

    <div class="history-modal" id="history-modal" hidden>
      <section class="history-dialog" role="dialog" aria-modal="true" aria-labelledby="history-dialog-title">
        <header class="history-dialog-header">
          <h2 id="history-dialog-title">Submission Details</h2>
          <button type="button" class="history-close" id="history-close" aria-label="Close history details">&times;</button>
        </header>
        <div class="history-detail-content" id="history-detail-content"></div>
      </section>
    </div>
  </main>
</body>

</html>
